# Test database for integration/e2e tests.
# Start:  docker compose -f docker-compose.test.yml up -d --wait
# Stop:   docker compose -f docker-compose.test.yml down
services:
  db-test:
    image: postgres:16
    environment:
      POSTGRES_DB: library_db_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"          # 5433 avoids clashing with a local Postgres or the dev DB
    tmpfs:
      - /var/lib/postgresql/data   # in-memory: fresh, empty DB every time
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d library_db_test"]
      interval: 2s
      timeout: 5s
      retries: 15
