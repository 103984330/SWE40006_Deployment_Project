name: CI/CD - Test, Build, Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, dev ]

# Never run two deployments at the same time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: library-app

jobs:

  # ---------- 1. Automated tests (runs on every PR and every push to main) ----------
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    # Throwaway PostgreSQL database for integration / E2E tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: library_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PORT: 3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: library_db
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create database schema
        run: psql -h localhost -U postgres -d library_db -f db/schema.sql
        env:
          PGPASSWORD: postgres

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run end-to-end tests
        run: npm run test:e2e

  # ---------- 2. Build the image once and push it to ECR (main only, not PRs) ----------
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "Pushed: $IMAGE"
          echo "Digest: $(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # ---------- 3. Deploy automatically to Staging ----------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run deploy script on Staging via SSM
        env:
          INSTANCE_ID: ${{ vars.STAGING_INSTANCE_ID }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $IMAGE_TAG to staging" \
            --parameters "commands=[\"/opt/library-app/deploy.sh $IMAGE_TAG\"]" \
            --query "Command.CommandId" --output text)
          echo "SSM command ID: $CMD_ID"

          # Wait up to 5 minutes for the deploy script to finish
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                     --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          echo "----- deploy.sh output -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text

          echo "Final status: $STATUS"
          [ "$STATUS" = "Success" ] || exit 1

      - name: Health check Staging
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ vars.STAGING_URL }}/health"; then echo; echo "Staging healthy"; exit 0; fi
            sleep 5
          done
          echo "Staging health check failed"; exit 1

  # ---------- 4. Deploy to Production (waits for manual approval) ----------
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ build-and-push, deploy-staging ]
    environment:
      name: production          # Required reviewers configured in repo Settings -> Environments
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run deploy script on Production via SSM
        env:
          INSTANCE_ID: ${{ vars.PRODUCTION_INSTANCE_ID }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $IMAGE_TAG to production" \
            --parameters "commands=[\"/opt/library-app/deploy.sh $IMAGE_TAG\"]" \
            --query "Command.CommandId" --output text)
          echo "SSM command ID: $CMD_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                     --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          echo "----- deploy.sh output -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text

          echo "Final status: $STATUS"
          [ "$STATUS" = "Success" ] || exit 1

      - name: Health check Production
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ vars.PRODUCTION_URL }}/health"; then echo; echo "Production healthy"; exit 0; fi
            sleep 5
          done
          echo "Production health check failed"; exit 1
